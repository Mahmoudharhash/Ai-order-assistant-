<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Daily Grind | Smart Menu</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
    <style>
        /* --- CSS STYLING --- */
        :root {
            --brand-dark: #1A3B32;
            --brand-cream: #FDFBF7;
            --brand-orange: #EAA64D;
            --brand-text: #333333;
            --brand-gray: #777777;
            --brand-green-light: #E8F0EC;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f4f4f4;
            color: var(--brand-text);
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }
        /* Mobile App Container */
        .app-container {
            width: 100%;
            max-width: 480px;
            background-color: var(--brand-cream);
            min-height: 100vh;
            box-shadow: 0 0 30px rgba(0,0,0,0.1);
            position: relative;
            padding-bottom: 40px;
            overflow-x: hidden;
        }
        /* Header */
        header {
            padding: 25px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            background-color: var(--brand-cream);
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }
        header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 1.6rem;
            color: var(--brand-dark);
            margin-bottom: 2px;
            letter-spacing: 0.5px;
        }
        header p {
            font-size: 0.65rem;
            letter-spacing: 2px;
            color: var(--brand-gray);
            text-transform: uppercase;
        }
        /* Lina Assistant Section */
        .lina-section {
            display: flex;
            align-items: flex-start;
            padding: 25px 20px;
            gap: 15px;
        }
        .lina-avatar-container {
            position: relative;
            flex-shrink: 0;
        }
        .lina-avatar {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            background-color: var(--brand-orange);
            border: 3px solid white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            overflow: hidden;
        }
        .lina-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .online-dot {
            position: absolute;
            bottom: 2px;
            right: 2px;
            width: 14px;
            height: 14px;
            background-color: #4CAF50;
            border: 2px solid white;
            border-radius: 50%;
        }
        .lina-bubble {
            background-color: white;
            padding: 16px;
            border-radius: 18px;
            border-top-left-radius: 4px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.04);
            font-size: 0.85rem;
            line-height: 1.5;
            color: var(--brand-dark);
            flex-grow: 1;
            position: relative;
        }
        .lina-name {
            font-weight: 600;
            font-size: 0.8rem;
            color: var(--brand-orange);
            margin-bottom: 5px;
            display: block;
        }
        
        /* Filters */
        .filters-container {
            padding: 0 20px;
            margin-bottom: 20px;
        }
        .filter-card {
            background-color: white;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.03);
            margin-bottom: 15px;
        }
        .filter-group {
            margin-bottom: 20px;
        }
        .filter-group:last-child { margin-bottom: 0; }
        .filter-group label {
            font-weight: 600;
            font-size: 0.8rem;
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            color: var(--brand-dark);
        }
        .budget-value {
            color: var(--brand-orange);
            font-size: 0.95rem;
        }
        
        /* Custom Range Slider */
        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 6px;
            background: #E8F0EC;
            border-radius: 5px;
            outline: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: var(--brand-dark);
            cursor: pointer;
            border: 4px solid var(--brand-cream);
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
            margin-top: -9px;
        }

        /* Dropdown */
        select {
            width: 100%;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid #eee;
            background-color: var(--brand-cream);
            font-family: inherit;
            font-size: 0.85rem;
            color: var(--brand-dark);
            font-weight: 500;
            outline: none;
        }

        /* Preference Pills */
        .pills-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .pill-checkbox {
            display: none;
        }
        .pill-label {
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid #E0E0E0;
            font-size: 0.75rem;
            font-weight: 500;
            color: var(--brand-gray);
            cursor: pointer;
            transition: all 0.2s ease;
            background-color: white;
        }
        .pill-checkbox:checked + .pill-label {
            background-color: var(--brand-dark);
            color: white;
            border-color: var(--brand-dark);
        }

        /* Results Grid */
        .results-container {
            padding: 0 20px;
        }
        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .results-header h2 {
            font-family: 'Playfair Display', serif;
            font-size: 1.3rem;
            color: var(--brand-dark);
        }
        .item-card {
            background-color: white;
            border-radius: 20px;
            overflow: hidden;
            margin-bottom: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.04);
            transition: transform 0.2s;
        }
        .item-card:active { transform: scale(0.98); }
        .item-image {
            width: 100%;
            height: 160px;
            background-color: #f0f0f0;
            object-fit: cover;
            display: block;
        }
        .item-content {
            padding: 18px;
        }
        .item-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 8px;
        }
        .item-name {
            font-weight: 600;
            font-size: 1.1rem;
            color: var(--brand-dark);
            line-height: 1.2;
        }
        .item-price {
            font-weight: 700;
            color: var(--brand-dark);
            font-size: 1.1rem;
            white-space: nowrap;
            margin-left: 10px;
        }
        .item-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 12px;
        }
        .tag {
            background-color: var(--brand-green-light);
            color: var(--brand-dark);
            font-size: 0.65rem;
            padding: 4px 8px;
            border-radius: 6px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        .item-desc {
            font-size: 0.8rem;
            color: var(--brand-gray);
            line-height: 1.5;
            margin-bottom: 15px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .btn-view {
            width: 100%;
            padding: 12px;
            background-color: white;
            color: var(--brand-dark);
            border: 1px solid var(--brand-dark);
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: background 0.2s;
            font-family: inherit;
        }
        .btn-view:hover { background-color: var(--brand-green-light); }
        .no-results {
            text-align: center;
            padding: 40px 20px;
            color: var(--brand-gray);
            background: white;
            border-radius: 20px;
        }
        .no-results span { font-size: 2rem; display: block; margin-bottom: 10px; }

        /* Modal (Bottom Sheet) */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            display: none;
            justify-content: center;
            align-items: flex-end;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .modal-overlay.active {
            display: flex;
            opacity: 1;
        }
        .modal-content {
            background: var(--brand-cream);
            width: 100%;
            max-width: 480px;
            border-top-left-radius: 30px;
            border-top-right-radius: 30px;
            padding: 25px;
            transform: translateY(100%);
            transition: transform 0.3s ease;
            max-height: 90vh;
            overflow-y: auto;
        }
        .modal-overlay.active .modal-content {
            transform: translateY(0);
        }
        .modal-drag-handle {
            width: 40px;
            height: 5px;
            background: #ddd;
            border-radius: 5px;
            margin: 0 auto 20px auto;
        }
        .modal-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 20px;
            margin-bottom: 20px;
        }
        .modal-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
            color: var(--brand-dark);
            margin-bottom: 8px;
        }
        .modal-price {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--brand-orange);
            margin-bottom: 15px;
        }
        .modal-section-title {
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--brand-dark);
            margin: 20px 0 10px 0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .modal-desc {
            font-size: 0.9rem;
            color: var(--brand-gray);
            line-height: 1.6;
        }
        .modal-ingredients {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .ingredient-tag {
            background: white;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.75rem;
            color: var(--brand-dark);
            border: 1px solid #eee;
        }
        .btn-add {
            width: 100%;
            padding: 16px;
            background-color: var(--brand-dark);
            color: white;
            border: none;
            border-radius: 15px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 25px;
            font-family: inherit;
            transition: background 0.2s;
        }
        .btn-add:active { background-color: #2a5548; }
        .btn-add.added { background-color: var(--brand-orange); }
        .close-modal {
            position: absolute;
            top: 20px; right: 20px;
            background: rgba(0,0,0,0.5);
            color: white;
            border: none;
            width: 30px; height: 30px;
            border-radius: 50%;
            font-size: 1.2rem;
            cursor: pointer;
            display: none; /* Hidden for bottom sheet style, rely on overlay click */
        }
    </style>
</head>

<div class="app-container">
    <!-- Header -->
    <header>
        <h1>The Daily Grind</h1>
        <p>Coffee & More</p>
    </header>

    <!-- Lina Assistant -->
    <div class="lina-section">
        <div class="lina-avatar-container">

                <img src="https://img.freepik.com/free-vector/hand-drawn-coffee-shop-logo-template_23-2149662232.jpg" alt="Lina">
            </div>
            <div class="online-dot"></div>
        </div>
        <div class="lina-bubble">
            <span class="lina-name">Lina</span>
            <div id="lina-message">Hi! I'm Lina. Set your budget and preferences below, and I'll find the perfect order for you!</div>
        </div>
    </div>

    <!-- Filters -->
    <div class="filters-container">
        <div class="filter-card">
            <!-- Budget -->
            <div class="filter-group">
                <label>Max Budget <span class="budget-value" id="budget-display">150 EGP</span></label>
                <input type="range" id="budget-slider" min="30" max="150" value="150" step="5">
            </div>

            <!-- Temperature / Type -->
            <div class="filter-group">
                <label>What are you in the mood for?</label>
                <select id="temp-select">
                    <option value="all">Everything</option>
                    <option value="cold">Something Cold / Iced 🧊</option>
                    <option value="hot">Something Hot ☕</option>
                    <option value="food">Food & Snacks 🥐</option>
                </select>
            </div>

            <!-- Preferences -->
            <div class="filter-group">
                <label>Dietary Preferences</label>
                <div class="pills-container">
                    <label><input type="checkbox" value="No Sugar" class="pill-checkbox pref-tag"><span class="pill-label">No Sugar</span></label>
                    <label><input type="checkbox" value="Vegan" class="pill-checkbox pref-tag"><span class="pill-label">Vegan</span></label>
                    <label><input type="checkbox" value="Sweet" class="pill-checkbox pref-tag"><span class="pill-label">Sweet</span></label>
                    <label><input type="checkbox" value="Low Calorie" class="pill-checkbox pref-tag"><span class="pill-label">Low Calorie</span></label>
                    <label><input type="checkbox" value="Snack" class="pill-checkbox pref-tag"><span class="pill-label">Snack</span></label>
                    <label><input type="checkbox" value="Strong" class="pill-checkbox pref-tag"><span class="pill-label">Strong</span></label>
                </div>
            </div>
        </div>
    </div>

    <!-- Results -->
    <div class="results-container">
        <div class="results-header">
            <h2 id="results-title">Recommended for you</h2>
        </div>
        <div id="menu-items"></div>
    </div>
</div>

<!-- Modal (Bottom Sheet) -->
<div class="modal-overlay" id="detail-modal">
    <div class="modal-content" id="modal-content-body">
        <!-- Content is generated by JavaScript -->
    </div>
</div>

    // --- 2. DOM ELEMENTS ---
    const budgetSlider = document.getElementById('budget-slider');
    const budgetDisplay = document.getElementById('budget-display');
    const tempSelect = document.getElementById('temp-select');
    const prefTags = document.querySelectorAll('.pref-tag');
    const menuContainer = document.getElementById('menu-items');
    const linaMessage = document.getElementById('lina-message');
    const modal = document.getElementById('detail-modal');
    const modalContent = document.getElementById('modal-content-body');

    // --- 3. RENDER FUNCTION ---
    function renderMenu(items) {
        menuContainer.innerHTML = '';
        
        if (items.length === 0) {
            menuContainer.innerHTML = `<div class="no-results"><span>😔</span>No items match your current filters.<br>Try adjusting them!</div>`;
            return;
        }

        items.forEach(item => {
            const card = document.createElement('div');
            card.className = 'item-card';
            
            let tagsHtml = '';
            item.tags.slice(0, 3).forEach(tag => { // Show max 3 tags on card
                tagsHtml += `<span class="tag">${tag}</span>`;
            });

            card.innerHTML = `
                <img src="${item.image}" alt="${item.name}" class="item-image" loading="lazy">
                <div class="item-content">
                    <div class="item-header">
                        <div class="item-name">${item.name}</div>
                        <div class="item-price">${item.price} EGP</div>
                    </div>
                    <div class="item-tags">${tagsHtml}</div>
                    <p class="item-desc">${item.description}</p>
                    <button class="btn-view" onclick="openDetails('${item.id}')">View Details</button>
                </div>
            `;
            menuContainer.appendChild(card);
        });
    }

    // --- 4. FILTER LOGIC ---
    function filterMenu() {
        const maxBudget = parseInt(budgetSlider.value);
        const tempFilter = tempSelect.value;
        
        const selectedPrefs = Array.from(prefTags)
            .filter(cb => cb.checked)
            .map(cb => cb.value);

        const filteredItems = menuData.filter(item => {
            // 1. Budget Check
            if (item.price > maxBudget) return false;

            // 2. Temperature / Type Check
            if (tempFilter === 'cold' && !item.tags.includes('Iced')) return false;
            if (tempFilter === 'hot' && !item.tags.includes('Hot')) return false;
            if (tempFilter === 'food' && !item.tags.includes('Snack') && !item.tags.includes('Savory') && !item.tags.includes('Dessert')) return false;

            // 3. Preference Tags Check
            if (selectedPrefs.length > 0) {
                const hasAllPrefs = selectedPrefs.every(pref => item.tags.includes(pref));
                if (!hasAllPrefs) return false;
            }

            return true;
        });

        renderMenu(filteredItems);
        updateLinaMessage(filteredItems, maxBudget, selectedPrefs, tempFilter);
    }

    // --- 5. LINA'S AUTOMATED PERSONALITY ---
    function updateLinaMessage(items, budget, prefs, temp) {
        let message = "";
        
        if (items.length === 0) {
            message = `Oh no! I couldn't find anything matching those exact preferences under ${budget} EGP. 😔 Try increasing your budget or removing a preference!`;
        } else if (items.length === 1) {
            message = `I found exactly one perfect match for you under ${budget} EGP! Check out the ${items[0].name}.`;
        } else if (prefs.length > 0) {
            message = `Great choice! I found ${items.length} options under ${budget} EGP that are ${prefs.join(' & ')}. Here are my top picks!`;
        } else if (temp !== 'all') {
            message = `Here are ${items.length} options for you under ${budget} EGP. Let me know if you want to narrow it down!`;
        } else {
            message = `Here are ${items.length} refreshing options for you under ${budget} EGP. Let me know if you want to narrow it down!`;
        }

        linaMessage.innerHTML = message;
    }

    // --- 6. MODAL LOGIC (View Details) ---
    window.openDetails = function(id) {
        const item = menuData.find(i => i.id === id);
        if (!item) return;

        let sizesHtml = item.sizes.map(s => `<span class="ingredient-tag">${s.name} (${s.price} EGP)</span>`).join('');
        let ingredientsHtml = item.ingredients.map(i => `<span class="ingredient-tag">${i}</span>`).join('');
        let tagsHtml = item.tags.map(t => `<span class="tag">${t}</span>`).join('');

        modalContent.innerHTML = `
            <div class="modal-drag-handle"></div>
            <img src="${item.image}" alt="${item.name}" class="modal-image">
            <h2 class="modal-title">${item.name}</h2>
            <div class="modal-price">${item.price} EGP</div>
            <div class="item-tags" style="margin-bottom:15px;">${tagsHtml}</div>
            
            <p class="modal-desc">${item.description}</p>
            
            <div class="modal-section-title">Available Sizes</div>
            <div class="modal-ingredients">${sizesHtml}</div>
            
            <div class="modal-section-title">Ingredients</div>
            <div class="modal-ingredients">${ingredientsHtml}</div>
            
            <button class="btn-add" onclick="addToList(this)">❤️ Add to My List</button>
        `;

        modal.classList.add('active');
    }

    window.addToList = function(btn) {
        btn.innerHTML = "✓ Added to List!";
        btn.classList.add('added');
        setTimeout(() => {
            btn.innerHTML = "❤️ Add to My List";
            btn.classList.remove('added');
        }, 2000);
    }

    // Close modal when clicking outside
    modal.addEventListener('click', (e) => {
        if (e.target === modal) {
            modal.classList.remove('active');
        }
    });

    // --- 7. EVENT LISTENERS ---
    budgetSlider.addEventListener('input', (e) => {
        budgetDisplay.textContent = `${e.target.value} EGP`;
        filterMenu();
    });

    tempSelect.addEventListener('change', filterMenu);
    
    prefTags.forEach(cb => {
        cb.addEventListener('change', filterMenu);
    });

    // Initial render
    filterMenu();

</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moon Cafe | Smart Menu</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
    <style>
        :root {
            --brand-dark: #1A3B32;
            --brand-cream: #FDFBF7;
            --brand-orange: #EAA64D;
            --brand-text: #333333;
            --brand-gray: #777777;
            --brand-green-light: #E8F0EC;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f4f4f4;
            color: var(--brand-text);
            display: flex;
            justify-content: center;
            min-height: 100vh;
            transition: direction 0.3s;
        }
        /* RTL Support */
        html[dir="rtl"] body { font-family: 'Cairo', sans-serif; }
        html[dir="rtl"] .lina-bubble { border-radius: 18px; border-top-right-radius: 4px; border-top-left-radius: 18px; }
        html[dir="rtl"] .item-price { margin-left: 0; margin-right: 10px; }
        html[dir="rtl"] .lina-bubble::before { display: none; }

        .app-container {
            width: 100%; max-width: 480px; background-color: var(--brand-cream);
            min-height: 100vh; box-shadow: 0 0 30px rgba(0,0,0,0.1);
            position: relative; padding-bottom: 40px; overflow-x: hidden;
        }
        /* Header */
        header {
            padding: 20px; display: flex; justify-content: space-between; align-items: center;
            background-color: var(--brand-cream); border-bottom: 1px solid rgba(0,0,0,0.05);
            position: sticky; top: 0; z-index: 100;
        }
        .header-logo { text-align: center; flex-grow: 1; }
        .header-logo h1 {
            font-family: 'Playfair Display', serif; font-size: 1.5rem;
            color: var(--brand-dark); margin-bottom: 2px; letter-spacing: 0.5px;
        }
        .header-logo p { font-size: 0.6rem; letter-spacing: 2px; color: var(--brand-gray); text-transform: uppercase; }
        
        .header-actions { display: flex; gap: 15px; align-items: center; }
        .icon-btn {
            background: none; border: none; font-size: 1.2rem; cursor: pointer;
            color: var(--brand-dark); position: relative; display: flex; align-items: center; justify-content: center;
        }
        .lang-btn { font-size: 0.8rem; font-weight: 700; border: 1px solid var(--brand-dark); padding: 4px 8px; border-radius: 8px; }
        .cart-badge {
            position: absolute; top: -5px; right: -8px; background-color: var(--brand-orange);
            color: white; font-size: 0.6rem; font-weight: bold; width: 16px; height: 16px;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
        }

        /* Lina Assistant */
        .lina-section { display: flex; align-items: flex-start; padding: 20px; gap: 15px; }
        .lina-avatar-container { position: relative; flex-shrink: 0; }
        .lina-avatar {
            width: 65px; height: 65px; border-radius: 50%; background-color: var(--brand-orange);
            border: 3px solid white; box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            display: flex; align-items: center; justify-content: center; overflow: hidden;
        }
        .lina-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .online-dot {
            position: absolute; bottom: 2px; right: 2px; width: 14px; height: 14px;
            background-color: #4CAF50; border: 2px solid white; border-radius: 50%;
        }
        .lina-bubble {
            background-color: white; padding: 16px; border-radius: 18px; border-top-left-radius: 4px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.04); font-size: 0.85rem; line-height: 1.5;
            color: var(--brand-dark); flex-grow: 1; position: relative;
        }
        .lina-name { font-weight: 600; font-size: 0.8rem; color: var(--brand-orange); margin-bottom: 5px; display: block; }

        /* Filters */
        .filters-container { padding: 0 20px; margin-bottom: 20px; }
        .filter-card {
            background-color: white; border-radius: 20px; padding: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.03); margin-bottom: 15px;
        }
        .filter-group { margin-bottom: 20px; }
        .filter-group:last-child { margin-bottom: 0; }
        .filter-group label {
            font-weight: 600; font-size: 0.8rem; display: flex; justify-content: space-between;
            margin-bottom: 12px; color: var(--brand-dark);
        }
        .budget-value { color: var(--brand-orange); font-size: 0.95rem; }
        
        input[type="range"] {
            -webkit-appearance: none; width: 100%; height: 6px; background: #E8F0EC;
            border-radius: 5px; outline: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none; width: 24px; height: 24px;
            border-radius: 50%; background: var(--brand-dark); cursor: pointer;
            border: 4px solid var(--brand-cream); box-shadow: 0 2px 6px rgba(0,0,0,0.2); margin-top: -9px;
        }

        /* Mood Pills */
        .pills-container { display: flex; flex-wrap: wrap; gap: 8px; }
        .pill-checkbox { display: none; }
        .pill-label {
            padding: 8px 16px; border-radius: 20px; border: 1px solid #E0E0E0;
            font-size: 0.75rem; font-weight: 500; color: var(--brand-gray); cursor: pointer;
            transition: all 0.2s ease; background-color: white;
        }
        .pill-checkbox:checked + .pill-label { background-color: var(--brand-dark); color: white; border-color: var(--brand-dark); }

        /* Results */
        .results-container { padding: 0 20px; }
        .results-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .results-header h2 { font-family: 'Playfair Display', serif; font-size: 1.3rem; color: var(--brand-dark); }
        html[dir="rtl"] .results-header h2 { font-family: 'Cairo', sans-serif; font-weight: 700; }
        
        .item-card {
            background-color: white; border-radius: 20px; overflow: hidden;
            margin-bottom: 20px; box-shadow: 0 8px 20px rgba(0,0,0,0.04);
        }
        .item-image { width: 100%; height: 160px; background-color: #f0f0f0; object-fit: cover; display: block; }
        .item-content { padding: 18px; }
        .item-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
        .item-name { font-weight: 600; font-size: 1.1rem; color: var(--brand-dark); line-height: 1.3; }
        .item-price { font-weight: 700; color: var(--brand-dark); font-size: 1.1rem; white-space: nowrap; }
        .item-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
        .tag {
            background-color: var(--brand-green-light); color: var(--brand-dark);
            font-size: 0.65rem; padding: 4px 8px; border-radius: 6px; font-weight: 600;
        }
        .item-desc {
            font-size: 0.8rem; color: var(--brand-gray); line-height: 1.5; margin-bottom: 15px;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
        }
        .btn-view {
            width: 100%; padding: 12px; background-color: white; color: var(--brand-dark);
            border: 1px solid var(--brand-dark); border-radius: 12px; font-weight: 600;
            font-size: 0.85rem; cursor: pointer; transition: background 0.2s; font-family: inherit;
        }
        .btn-view:hover { background-color: var(--brand-green-light); }

        /* Modal */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6); display: none; justify-content: center;
            align-items: flex-end; z-index: 1000; opacity: 0; transition: opacity 0.3s ease;
        }
        .modal-overlay.active { display: flex; opacity: 1; }
        .modal-content {
            background: var(--brand-cream); width: 100%; max-width: 480px;
            border-top-left-radius: 30px; border-top-right-radius: 30px; padding: 25px;
            transform: translateY(100%); transition: transform 0.3s ease;
            max-height: 90vh; overflow-y: auto;
        }
        .modal-overlay.active .modal-content { transform: translateY(0); }
        .modal-drag-handle { width: 40px; height: 5px; background: #ddd; border-radius: 5px; margin: 0 auto 20px auto; }
        .modal-image { width: 100%; height: 200px; object-fit: cover; border-radius: 20px; margin-bottom: 20px; }
        .modal-title { font-family: 'Playfair Display', serif; font-size: 1.5rem; color: var(--brand-dark); margin-bottom: 8px; }
        html[dir="rtl"] .modal-title { font-family: 'Cairo', sans-serif; }
        .modal-price { font-size: 1.2rem; font-weight: 700; color: var(--brand-orange); margin-bottom: 15px; }
        .modal-section-title { font-weight: 600; font-size: 0.85rem; color: var(--brand-dark); margin: 20px 0 10px 0; text-transform: uppercase; letter-spacing: 1px; }
        .modal-desc { font-size: 0.9rem; color: var(--brand-gray); line-height: 1.6; }
        
        .btn-add {
            width: 100%; padding: 16px; background-color: var(--brand-dark); color: white;
            border: none; border-radius: 15px; font-weight: 600; font-size: 1rem;
            cursor: pointer; margin-top: 25px; font-family: inherit; transition: background 0.2s;
        }
        .btn-add:active { background-color: #2a5548; }
        .btn-add.added { background-color: var(--brand-orange); }

        /* Cart Modal Specific */
        .cart-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 0; border-bottom: 1px solid #eee;
        }
        .cart-item-info { display: flex; flex-direction: column; gap: 5px; }
        .cart-item-title { font-weight: 600; color: var(--brand-dark); font-size: 0.95rem; }
        .cart-item-price { font-size: 0.85rem; color: var(--brand-gray); }
        .cart-controls { display: flex; align-items: center; gap: 10px; }
        .qty-btn {
            width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--brand-dark);
            background: white; color: var(--brand-dark); font-weight: bold; cursor: pointer;
            display: flex; align-items: center; justify-content: center; font-size: 1rem;
        }
        .cart-total {
            display: flex; justify-content: space-between; align-items: center;
            margin-top: 20px; font-size: 1.2rem; font-weight: 700; color: var(--brand-dark);
            padding-top: 20px; border-top: 2px dashed #ddd;
        }
        .empty-cart { text-align: center; padding: 40px 0; color: var(--brand-gray); }
        
        .no-results { text-align: center; padding: 40px 20px; color: var(--brand-gray); background: white; border-radius: 20px; }
        .no-results span { font-size: 2rem; display: block; margin-bottom: 10px; }

        /* Full Menu Modal */
        .full-menu-img { width: 100%; height: auto; border-radius: 15px; }
    </style>
</head>

<div class="app-container">

            </div>

            <!-- Mood Pills (Multi-select) -->

                    <label><input type="checkbox" value="Fruity" class="pill-checkbox mood-pill"><span class="pill-label" data-en="Fruity 🍹" data-ar="فواكه 🍹">Fruity 🍹</span></label>
                    <label><input type="checkbox" value="Coffee" class="pill-checkbox mood-pill"><span class="pill-label" data-en="Coffee ☕" data-ar="قهوة ☕">Coffee ☕</span></label>
                    <label><input type="checkbox" value="Creamy" class="pill-checkbox mood-pill"><span class="pill-label" data-en="Creamy 🥛" data-ar="كريمي 🥛">Creamy 🥛</span></label>
                </div>
            </div>

            <div class="filter-group">
                <button class="btn-view" onclick="openFullMenu()" id="btn-full-menu" style="border-color: var(--brand-orange); color: var(--brand-orange);">
                    📖 View Full Menu Image
                </button>
            </div>
        </div>
    </div>

    <!-- Results -->
    <div class="results-container">
        <div class="results-header">
            <h2 id="results-title">Recommended for you</h2>
        </div>
        <div id="menu-items"></div>
    </div>
</div>

<!-- Detail Modal -->
<div class="modal-overlay" id="detail-modal">
    <div class="modal-content" id="modal-content-body"></div>
</div>

<!-- Cart Modal -->
<div class="modal-overlay" id="cart-modal">
    <div class="modal-content">
        <div class="modal-drag-handle"></div>
        <h2 class="modal-title" id="cart-title">My List</h2>
        <div id="cart-items-container"></div>
        <div class="cart-total" id="cart-total-container" style="display: none;">
            <span id="lbl-total">Total:</span>
            <span id="cart-total-price">0 EGP</span>
        </div>
        <button class="btn-add" onclick="closeModal('cart-modal')" id="btn-close-cart" style="margin-top: 15px;">Close</button>
    </div>
</div>

<!-- Full Menu Modal -->
<div class="modal-overlay" id="full-menu-modal">
    <div class="modal-content">

</div>

                // Auto-generate tags based on name/description to make filters work
                let tags = [];
                let searchString = (item.name_en + " " + item.description_en + " " + cat.category_en).toLowerCase();
                
                if (searchString.includes('iced') || searchString.includes('cold') || searchString.includes('frappe') || searchString.includes('mojito') || searchString.includes('smoothie') || searchString.includes('ice cream')) tags.push('Cold');
                if (searchString.includes('hot') || cat.category_en.includes('Hot')) tags.push('Hot');
                if (searchString.includes('sweet') || searchString.includes('caramel') || searchString.includes('nutella') || searchString.includes('chocolate') || searchString.includes('lotus') || cat.category_en.includes('Dessert') || cat.category_en.includes('Waffle') || cat.category_en.includes('Ice Cream') || cat.category_en.includes('Milkshake')) tags.push('Sweet');
                if (searchString.includes('juice') || searchString.includes('fruit') || searchString.includes('berry') || searchString.includes('mango') || cat.category_en.includes('Refresher') || cat.category_en.includes('Cocktail') || cat.category_en.includes('Smoothie')) tags.push('Fruity');
                if (searchString.includes('coffee') || searchString.includes('espresso') || searchString.includes('latte') || searchString.includes('mocha') || searchString.includes('cappuccino') || searchString.includes('macchiato') || cat.category_en.includes('Coffee')) tags.push('Coffee');
                if (searchString.includes('milk') || searchString.includes('latte') || searchString.includes('creamy') || searchString.includes('shake')) tags.push('Creamy');

                // Remove duplicates
                tags = [...new Set(tags)];

                flatMenu.push({
                    id: "item_" + Math.random().toString(36).substr(2, 9),
                    name_en: item.name_en,
                    name_ar: item.name_ar,
                    price: item.price,
                    desc_en: item.description_en,
                    desc_ar: item.description_ar,
                    category_en: cat.category_en,
                    category_ar: cat.category_ar,
                    tags: tags,
                    image: getItemImage(item.name_en, cat.category_en)
                });
            });
        });
    }

    // 🖼️ VALIDATED IMAGE MAPPING ENGINE
    function getItemImage(name, category) {
        const n = name.toLowerCase();
        const c = category.toLowerCase();
        
        // Specific items matching
        if (n.includes('espresso') && !n.includes('iced')) return 'https://images.unsplash.com/photo-1510591509098-f4fdc6d0ff04?auto=format&fit=crop&w=600&q=80';
        if (n.includes('turkish')) return 'https://images.unsplash.com/photo-1595144479298-8b0809929c0a?auto=format&fit=crop&w=600&q=80';
        if (n.includes('cappuccino') || n.includes('flat white') || n.includes('cortado')) return 'https://images.unsplash.com/photo-1572442388796-11668a67e53d?auto=format&fit=crop&w=600&q=80';
        if (n.includes('latte') && !n.includes('iced')) return 'https://images.unsplash.com/photo-1541167760496-1628856ab772?auto=format&fit=crop&w=600&q=80';
        if (n.includes('mocha') && !n.includes('iced')) return 'https://images.unsplash.com/photo-1578314675249-a6910f80cc4e?auto=format&fit=crop&w=600&q=80';
        if (n.includes('hot chocolate') || n.includes('sahlab')) return 'https://images.unsplash.com/photo-1542990253-0d0f5be5f0ed?auto=format&fit=crop&w=600&q=80';
        if (n.includes('tea') && !n.includes('iced')) return 'https://images.unsplash.com/photo-1544787219-7f47ccb76574?auto=format&fit=crop&w=600&q=80';
        
        // Iced & Cold
        if (n.includes('iced') || n.includes('ice ') || n.includes('cold')) {
            if (n.includes('matcha')) return 'https://images.unsplash.com/photo-1536256263959-770b48d82b0a?auto=format&fit=crop&w=600&q=80';
            if (n.includes('spanish')) return 'https://images.unsplash.com/photo-1559496417-e7f25cb247f3?auto=format&fit=crop&w=600&q=80';
            if (n.includes('americano')) return 'https://images.unsplash.com/photo-1517701550927-30cf4ba1dba5?auto=format&fit=crop&w=600&q=80';
            return 'https://images.unsplash.com/photo-1461023058943-07fcbe16d735?auto=format&fit=crop&w=600&q=80'; // Generic iced coffee
        }
        
        // Matcha
        if (n.includes('matcha')) return 'https://images.unsplash.com/photo-1536256263959-770b48d82b0a?auto=format&fit=crop&w=600&q=80';
        
        // Boba
        if (n.includes('boba')) return 'https://images.unsplash.com/photo-1558857563-b371033873b8?auto=format&fit=crop&w=600&q=80';
        
        // Frappe / Frappuccino
        if (n.includes('frappe') || n.includes('frappuccino')) return 'https://images.unsplash.com/photo-1572442388796-11668a67e53d?auto=format&fit=crop&w=600&q=80';
        
        // Milkshake
        if (n.includes('milkshake')) return 'https://images.unsplash.com/photo-1572490122747-3968b75cc699?auto=format&fit=crop&w=600&q=80';
        
        // Cocktail, Mojito, Smoothie
        if (n.includes('mojito') || n.includes('cocktail')) return 'https://images.unsplash.com/photo-1513558161293-cdaf765ed2fd?auto=format&fit=crop&w=600&q=80';
        if (n.includes('smoothie')) return 'https://images.unsplash.com/photo-1553530666-ba11a7da3888?auto=format&fit=crop&w=600&q=80';
        
        // Juices
        if (n.includes('juice') || n.includes('lemonade') || n.includes('prickly pear')) return 'https://images.unsplash.com/photo-1600271886742-f049cd451bba?auto=format&fit=crop&w=600&q=80';
        if (n.includes('mango')) return 'https://images.unsplash.com/photo-1546173159-315724a31696?auto=format&fit=crop&w=600&q=80';
        if (n.includes('strawberry')) return 'https://images.unsplash.com/photo-1551024709-8f23befc6f87?auto=format&fit=crop&w=600&q=80';
        
        // Desserts & Bakery
        if (n.includes('ice cream') || n.includes('affogato')) return 'https://images.unsplash.com/photo-1563805042-7684c019e1cb?auto=format&fit=crop&w=600&q=80';
        if (n.includes('waffle')) return 'https://images.unsplash.com/photo-1562376552-0d160a2f238d?auto=format&fit=crop&w=600&q=80';
        if (n.includes('pancake')) return 'https://images.unsplash.com/photo-1567620905732-2d1ec7ab7445?auto=format&fit=crop&w=600&q=80';
        if (n.includes('cheesecake')) return 'https://images.unsplash.com/photo-1533134242443-d4fd215305ad?auto=format&fit=crop&w=600&q=80';
        if (n.includes('tiramisu')) return 'https://images.unsplash.com/photo-1571115177098-24ec42ed204d?auto=format&fit=crop&w=600&q=80';
        if (n.includes('cake') || n.includes('brownie')) return 'https://images.unsplash.com/photo-1578985545062-69928b1d9587?auto=format&fit=crop&w=600&q=80';
        if (n.includes('croissant')) return 'https://images.unsplash.com/photo-1555507036-ab1f4038808a?auto=format&fit=crop&w=600&q=80';
        if (n.includes('cookie')) return 'https://images.unsplash.com/photo-1499636136210-6f4ee915583e?auto=format&fit=crop&w=600&q=80';
        if (n.includes('turkey') || n.includes('beef') || n.includes('cheese')) return 'https://images.unsplash.com/photo-1528735602780-2552fd46c7af?auto=format&fit=crop&w=600&q=80';

        // Generic Fallbacks based on category
        if (c.includes('hot')) return 'https://images.unsplash.com/photo-1510591509098-f4fdc6d0ff04?auto=format&fit=crop&w=600&q=80';
        if (c.includes('cold') || c.includes('iced')) return 'https://images.unsplash.com/photo-1517701550927-30cf4ba1dba5?auto=format&fit=crop&w=600&q=80';
        if (c.includes('bakery')) return 'https://images.unsplash.com/photo-1509440159596-0249088772ff?auto=format&fit=crop&w=600&q=80';
        if (c.includes('dessert')) return 'https://images.unsplash.com/photo-1551024506-0bccd828d307?auto=format&fit=crop&w=600&q=80';
        if (c.includes('coffee')) return 'https://images.unsplash.com/photo-1497935586351-b67a49e012bf?auto=format&fit=crop&w=600&q=80';
        
        return 'https://images.unsplash.com/photo-1497935586351-b67a49e012bf?auto=format&fit=crop&w=600&q=80'; // Ultimate default
    }

    // ==========================================
    // 2. STATE MANAGEMENT (Cart & Language)
    // ==========================================
    let currentLang = 'en';
    let cart = []; // Array to hold { item, quantity }

    const translations = {
        en: {
            budget: "Max Budget", mood: "What are you in the mood for?", viewMenu: "📖 View Full Menu Image", 
            recommended: "Recommended for you", viewDetails: "View Details", addList: "❤️ Add to My List", 
            added: "✓ Added to List!", myList: "My List", total: "Total:", emptyCart: "Your list is empty. Add some items!", 
            close: "Close", fullMenu: "Full Menu", noResults: "No items match your filters."
        },
        ar: {
            budget: "أقصى ميزانية", mood: "ما هو مزاجك الآن؟", viewMenu: "📖 عرض صورة المنيو كاملة", 
            recommended: "مقترح لك", viewDetails: "عرض التفاصيل", addList: "❤️ أضف إلى قائمتي", 
            added: "✓ تمت الإضافة!", myList: "قائمتي", total: "الإجمالي:", emptyCart: "قائمتك فارغة. أضف بعض العناصر!", 
            close: "إغلاق", fullMenu: "المنيو كاملة", noResults: "لا توجد عناصر تطابق بحثك."
        }
    };

    // ==========================================
    // 3. DOM ELEMENTS
    // ==========================================
    const budgetSlider = document.getElementById('budget-slider');
    const budgetDisplay = document.getElementById('budget-display');
    const menuContainer = document.getElementById('menu-items');
    const linaMessage = document.getElementById('lina-message');
    const modal = document.getElementById('detail-modal');
    const modalContent = document.getElementById('modal-content-body');
    const cartModal = document.getElementById('cart-modal');

    // ==========================================
    // 4. LANGUAGE LOGIC
    // ==========================================
    function toggleLanguage() {
        currentLang = currentLang === 'en' ? 'ar' : 'en';
        document.documentElement.dir = currentLang === 'ar' ? 'rtl' : 'ltr';
        document.documentElement.lang = currentLang;
        document.getElementById('lang-toggle').innerText = currentLang === 'en' ? 'AR' : 'EN';
        
        // Update static UI text
        const t = translations[currentLang];
        document.getElementById('lbl-budget').innerText = t.budget;
        document.getElementById('lbl-mood').innerText = t.mood;
        document.getElementById('btn-full-menu').innerText = t.viewMenu;
        document.getElementById('results-title').innerText = t.recommended;
        document.getElementById('cart-title').innerText = t.myList;
        document.getElementById('lbl-total').innerText = t.total;
        document.getElementById('btn-close-cart').innerText = t.close;
        document.getElementById('full-menu-title').innerText = t.fullMenu;

        // Update Mood Pills text
        document.querySelectorAll('.mood-pill').forEach(checkbox => {
            const label = checkbox.nextElementSibling;
            label.innerText = currentLang === 'en' ? label.getAttribute('data-en') : label.getAttribute('data-ar');
        });

        filterMenu(); // Re-render menu
        renderCart(); // Re-render cart
    }

    // ==========================================
    // 5. RENDER FUNCTIONS
    // ==========================================
    function renderMenu(items) {
        menuContainer.innerHTML = '';
        const t = translations[currentLang];
        
        if (items.length === 0) {
            menuContainer.innerHTML = `<div class="no-results"><span>😔</span>${t.noResults}</div>`;
            return;
        }

        items.forEach(item => {
            const card = document.createElement('div');
            card.className = 'item-card';
            
            let tagsHtml = '';
            item.tags.slice(0, 3).forEach(tag => {
                tagsHtml += `<span class="tag">${tag}</span>`;
            });

            const name = currentLang === 'en' ? item.name_en : item.name_ar;
            const desc = currentLang === 'en' ? item.desc_en : item.desc_ar;

            card.innerHTML = `
                <img src="${item.image}" alt="${name}" class="item-image" loading="lazy">
                <div class="item-content">
                    <div class="item-header">
                        <div class="item-name">${name}</div>
                        <div class="item-price">${item.price} EGP</div>
                    </div>
                    <div class="item-tags">${tagsHtml}</div>
                    <p class="item-desc">${desc}</p>
                    <button class="btn-view" onclick="openDetails('${item.id}')">${t.viewDetails}</button>
                </div>
            `;
            menuContainer.appendChild(card);
        });
    }

    function updateLinaMessage(items, budget) {
        let message = "";
        const t = translations[currentLang];
        
        if (items.length === 0) {
            message = currentLang === 'en' 
                ? `Oh no! I couldn't find anything matching those preferences under ${budget} EGP. 😔 Try adjusting your filters!`
                : `للأسف! لم أجد أي شيء يطابق هذه التفضيلات تحت ${budget} جنيه. 😔 جرب تغيير الفلاتر!`;
        } else {
            message = currentLang === 'en'
                ? `Great! I found ${items.length} options for you under ${budget} EGP. Here are my top picks!`
                : `رائع! وجدت ${items.length} خيارات لك تحت ${budget} جنيه. إليك أفضل الاقتراحات!`;
        }

        linaMessage.innerHTML = message;
    }

    // ==========================================
    // 6. FILTER LOGIC
    // ==========================================
    function filterMenu() {
        const maxBudget = parseInt(budgetSlider.value);
        const selectedMoods = Array.from(document.querySelectorAll('.mood-pill:checked')).map(cb => cb.value);
        budgetDisplay.textContent = `${maxBudget} EGP`;

        const filteredItems = flatMenu.filter(item => {
            // Budget Check
            if (item.price > maxBudget) return false;

            // Mood Check (Tags) - Must match ALL selected moods
            if (selectedMoods.length > 0) {
                const hasAllMoods = selectedMoods.every(mood => item.tags.includes(mood));
                if (!hasAllMoods) return false;
            }
            return true;
        });

        renderMenu(filteredItems);
        updateLinaMessage(filteredItems, maxBudget);
    }

    // ==========================================
    // 7. MODAL & CART LOGIC
    // ==========================================
    window.openDetails = function(id) {
        const item = flatMenu.find(i => i.id === id);
        if (!item) return;

        const t = translations[currentLang];
        const name = currentLang === 'en' ? item.name_en : item.name_ar;
        const desc = currentLang === 'en' ? item.desc_en : item.desc_ar;
        const cat = currentLang === 'en' ? item.category_en : item.category_ar;
        let tagsHtml = item.tags.map(tag => `<span class="tag">${tag}</span>`).join('');

        modalContent.innerHTML = `
            <div class="modal-drag-handle"></div>
            <img src="${item.image}" alt="${name}" class="modal-image">
            <h2 class="modal-title">${name}</h2>
            <div class="modal-price">${item.price} EGP</div>
            <div class="item-tags" style="margin-bottom:15px;">${tagsHtml}</div>
            
            <p class="modal-desc">${desc}</p>
            
            <div class="modal-section-title">${cat}</div>
            
            <button class="btn-add" id="btn-add-cart" onclick="addToCart('${item.id}')">${t.addList}</button>
        `;

        modal.classList.add('active');
    }

    window.addToCart = function(id) {
        const item = flatMenu.find(i => i.id === id);
        if (!item) return;

        const existing = cart.find(c => c.item.id === id);
        if (existing) {
            existing.quantity += 1;
        } else {
            cart.push({ item: item, quantity: 1 });
        }

        // Update button UI
        const btn = document.getElementById('btn-add-cart');
        if(btn) {
            btn.innerHTML = translations[currentLang].added;
            btn.classList.add('added');
        }

        updateCartBadge();
        setTimeout(() => { closeModal('detail-modal'); }, 800);
    }

    function updateCartBadge() {
        const count = cart.reduce((total, c) => total + c.quantity, 0);
        document.getElementById('cart-count').innerText = count;
    }

    window.openCart = function() {
        renderCart();
        cartModal.classList.add('active');
    }

    function renderCart() {
        const container = document.getElementById('cart-items-container');
        const totalContainer = document.getElementById('cart-total-container');
        const totalPrice = document.getElementById('cart-total-price');
        const t = translations[currentLang];

        if (cart.length === 0) {
            container.innerHTML = `<div class="empty-cart">${t.emptyCart}</div>`;
            totalContainer.style.display = 'none';
            return;
        }

        let html = '';
        let total = 0;

        cart.forEach(c => {
            const name = currentLang === 'en' ? c.item.name_en : c.item.name_ar;
            const itemTotal = c.item.price * c.quantity;
            total += itemTotal;

            html += `
                <div class="cart-item">
                    <div class="cart-item-info">
                        <span class="cart-item-title">${name}</span>
                        <span class="cart-item-price">${c.item.price} EGP x ${c.quantity} = ${itemTotal} EGP</span>
                    </div>
                    <div class="cart-controls">
                        <button class="qty-btn" onclick="updateQuantity('${c.item.id}', -1)">-</button>
                        <span>${c.quantity}</span>
                        <button class="qty-btn" onclick="updateQuantity('${c.item.id}', 1)">+</button>
                    </div>
                </div>
            `;
        });

        container.innerHTML = html;
        totalContainer.style.display = 'flex';
        totalPrice.innerText = `${total} EGP`;
    }

    window.updateQuantity = function(id, change) {
        const existing = cart.find(c => c.item.id === id);
        if (!existing) return;

        existing.quantity += change;
        if (existing.quantity <= 0) {
            cart = cart.filter(c => c.item.id !== id);
        }
        updateCartBadge();
        renderCart();
    }

    window.closeModal = function(modalId) {
        document.getElementById(modalId).classList.remove('active');
    }

    window.openFullMenu = function() {
        document.getElementById('full-menu-modal').classList.add('active');
    }

    // Close modal on overlay click
    document.querySelectorAll('.modal-overlay').forEach(overlay => {
        overlay.addEventListener('click', (e) => {
            if (e.target === overlay) {
                overlay.classList.remove('active');
            }
        });
    });

    // Event Listeners
    budgetSlider.addEventListener('input', filterMenu);
    // Listen for changes on any mood pill
    document.querySelectorAll('.mood-pill').forEach(cb => {
        cb.addEventListener('change', filterMenu);
    });

    // Initial Render
    filterMenu();
</script>
</body>
</html>
